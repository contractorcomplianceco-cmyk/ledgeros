kind = "web"
previewPath = "/"
title = "LedgerOS"
version = "1.0.0"
id = "artifacts/ledgeros"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21897

[services.development]
run = "pnpm --filter @workspace/ledgeros run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ledgeros", "run", "build" ]
publicDir = "artifacts/ledgeros/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21897"
BASE_PATH = "/"
